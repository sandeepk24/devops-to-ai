# Optional Kubernetes sketches for the GPU / vLLM path.
# These are starting points — adjust node selectors, resources, and model IDs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - mistralai/Mistral-7B-Instruct-v0.3
            - --max-model-len
            - "8192"
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 24Gi
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-platform
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: llm-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/inference-gateway:0.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: INFERENCE_URL
              value: http://vllm:8000
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: llm-gateway
                  key: api_keys
            - name: RATE_LIMIT_RPM
              value: "120"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: llm-platform
spec:
  selector:
    app: inference-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
