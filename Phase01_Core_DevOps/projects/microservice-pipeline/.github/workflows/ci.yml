name: ci

on:
  push:
    branches: [main]
  pull_request:

# TODO: tighten permissions per job (least privilege)
permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Ruff
        working-directory: Phase01_Core_DevOps/projects/microservice-pipeline
        # When you copy this project to its own repo, drop the working-directory lines
        run: ruff check app tests || true
        # TODO: remove `|| true` once you've fixed lint findings — CI should fail on lint errors

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase01_Core_DevOps/projects/microservice-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Phase01_Core_DevOps/projects/microservice-pipeline/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pytest with coverage
        run: pytest --cov=app --cov-fail-under=70 -q
        # TODO: raise the bar if you add more code

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${{ github.repository_owner }}/phase01-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # TODO: login to GHCR (docker/login-action) using GITHUB_TOKEN
      # TODO: build and push with tags :${{ github.sha }} and :latest
      # Hint: context should be Phase01_Core_DevOps/projects/microservice-pipeline
      #       (or "." if this folder is its own repo)
      - name: Build only (push TODO)
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            Phase01_Core_DevOps/projects/microservice-pipeline

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: |
          echo "Path A (kind on a laptop): runners cannot reach your local cluster."
          echo "Document a manual: helm upgrade --install api ./helm/api -f values-dev.yaml"
          echo "Path B: configure KUBE_CONFIG secret and helm upgrade here."
          # TODO: helm upgrade --install using image tag ${{ github.sha }}
